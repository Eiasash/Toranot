[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Edge Functions — Deno runtime, no 26s sync wall, native streaming ──
# /api/claude is served by netlify/edge-functions/claude.ts. It supersedes
# the old netlify/functions/claude.ts (kept as the emergency-rollback
# target, hit directly at /.netlify/functions/claude — no /api alias, see
# rollback note below). The Edge Function declares `path` in its config
# export, so no `[[edge_functions]]` block needed here.

[functions."toranot-keepalive"]
  schedule = "0 6 */5 * *"

[functions."self-audit"]
  schedule = "0 5 * * 1"

[functions."claude"]
  included_files = []

[functions."claude".config]
  timeout = 26

[functions."gemini".config]
  timeout = 26

[functions."ocr-proxy".config]
  timeout = 26

# ── API rewrites — map /api/* to Netlify Functions ──
# /api/claude is intentionally NOT redirected here — the Edge Function at
# netlify/edge-functions/claude.ts owns that path via its config.path export.
#
# Emergency-rollback path for the /api/claude edge function: hit
# /.netlify/functions/claude directly (the original sync function is still
# deployed and untouched by edge-function changes). There is no /api/*
# alias for it — a previous /api/claude-legacy redirect was removed
# because Netlify's routing engine silently 404'd it (the redirect's
# /api/claude* prefix collided with the edge function's config.path
# matcher; same routing-precedence bug class that killed /api/ocr-proxy
# in PR #100).

[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200

[[redirects]]
  from = "/api/ocr"
  to = "/.netlify/functions/ocr-proxy"
  status = 200

# Note: `/api/ocr-proxy` (the function's own name) was previously declared
# here as a duplicate alias for `/api/ocr`, but Netlify's routing did not
# fire that redirect at runtime — every request returned 404 SPA HTML even
# though the parsed redirect rule was reported as valid in deploy checks.
# The only client (`src/components/Scanner.tsx`) uses `/api/ocr`, so the
# dead alias was removed in PR #100. Same routing-precedence bug class
# also killed `/api/claude-legacy` (removed in the PR introducing this
# comment). If a need for a function-name-matching `/api/*` alias
# resurfaces, use a semantically-different slug or hit
# `/.netlify/functions/<name>` directly.

[[redirects]]
  from = "/api/github-pat"
  to = "/.netlify/functions/github-pat"
  status = 200

[[redirects]]
  from = "/api/self-audit"
  to = "/.netlify/functions/self-audit"
  status = 200

[[redirects]]
  from = "/api/skill-snapshot"
  to = "/.netlify/functions/skill-snapshot"
  status = 200

[[redirects]]
  from = "/api/feedback-notify"
  to = "/.netlify/functions/feedback-notify"
  status = 200

# ── SPA catch-all — must be LAST redirect ──
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; media-src 'self' data: blob:; connect-src 'self' https://*.supabase.co https://*.supabase.in https://api.anthropic.com https://generativelanguage.googleapis.com; worker-src 'self' blob:; manifest-src 'self'"

[[headers]]
  for = "/reset.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.map"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw-nuke.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/iv-protocols.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

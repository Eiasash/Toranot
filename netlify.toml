[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."claude"]
  included_files = []

# Per-function timeout overrides (max 26s on nf_team_dev)
[functions."claude".config]
  timeout = 26

[functions."gemini".config]
  timeout = 26

[functions."ocr-proxy".config]
  timeout = 26

# ── Security headers (all routes) ────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src \'self\'; base-uri \'self\'; frame-ancestors \'self\'; object-src \'none\'; img-src \'self\' data: blob:; style-src \'self\' \'unsafe-inline\'; script-src \'self\'; connect-src \'self\' https://*.supabase.co https://*.supabase.in https://api.anthropic.com https://generativelanguage.googleapis.com; worker-src \'self\' blob:; manifest-src \'self\'"

# ── Hashed JS/CSS assets — immutable, 1 year ─────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Source maps — private, no CDN cache ──────────────────────────────
[[headers]]
  for = "/assets/*.map"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

# ── SW + nuke script — never cache ───────────────────────────────────
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw-nuke.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── HTML shell — revalidate on every request (CDN-friendly) ──────────
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Icons + manifest — short cache ────────────────────────────────────
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

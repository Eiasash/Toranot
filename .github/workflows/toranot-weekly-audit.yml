name: Toranot Weekly Audit
on:
  schedule:
    - cron: '0 5 * * 1'  # Monday 5am UTC (7am Jerusalem)
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        id: tests
        run: |
          OUTPUT=$(npx vitest run 2>&1)
          echo "$OUTPUT"
          TESTS=$(echo "$OUTPUT" | grep "Tests" | grep -oP '\d+ passed' | grep -oP '\d+')
          FILES=$(echo "$OUTPUT" | grep "Test Files" | grep -oP '\d+ passed' | grep -oP '\d+')
          echo "test_count=$TESTS" >> $GITHUB_OUTPUT
          echo "file_count=$FILES" >> $GITHUB_OUTPUT

      - name: Build and check bundle size
        id: build
        run: |
          npx vite build
          # Main entry chunk is dist/assets/index-<hash>.js (Vite naming).
          MAIN_JS=$(ls -1 dist/assets/index-*.js 2>/dev/null | head -1)
          if [ -z "$MAIN_JS" ]; then
            echo "::error::No main entry chunk found in dist/assets/"
            ls -la dist/assets/ || true
            exit 1
          fi
          # awk handles the float math without bc and is portable.
          # Use decimal kB to match Vite's reported size (original 150 kB budget was set in decimal kB).
          SIZE=$(awk -v b="$(stat -c%s "$MAIN_JS")" 'BEGIN{printf "%.2f", b/1000}')
          echo "Main entry: $MAIN_JS = $SIZE kB"
          echo "bundle_size=$SIZE" >> $GITHUB_OUTPUT
          if awk "BEGIN{exit !($SIZE > 150)}"; then
            echo "::error::Bundle size ${SIZE} kB exceeds 150 kB limit"
            exit 1
          fi

      - name: Engine integrity checks
        run: |
          echo "=== Banned patterns ==="
          if grep -rn "transition-all" src/components/ src/index.css 2>/dev/null; then
            echo "::error::transition-all found — banned"
            exit 1
          fi
          CONSOLE_LEAKS=$(grep -rn "console.log" src/ --include="*.ts" --include="*.tsx" | grep -v "__tests__" | grep -v "import.meta.env.DEV" | wc -l)
          if [ "$CONSOLE_LEAKS" -gt 5 ]; then
            echo "::warning::$CONSOLE_LEAKS ungated console.log statements"
          fi
          echo "=== Engine file sizes ==="
          wc -l src/engine/*.ts
          RULES_LOC=$(wc -l < src/engine/rules.ts)
          if [ "$RULES_LOC" -gt 1500 ]; then
            echo "::warning::rules.ts is $RULES_LOC LOC"
          fi
          CARD_LOC=$(wc -l < src/components/PatientCard.tsx)
          echo "PatientCard.tsx: $CARD_LOC LOC"
          if [ "$CARD_LOC" -gt 1500 ]; then
            echo "::warning::PatientCard.tsx is $CARD_LOC LOC — split overdue"
          fi

      - name: Call self-audit endpoint
        id: selfaudit
        continue-on-error: true
        run: |
          AUDIT=$(curl -sf "https://toranot.netlify.app/.netlify/functions/self-audit" 2>/dev/null || echo '{"status":"UNREACHABLE"}')
          echo "$AUDIT" | python3 -m json.tool 2>/dev/null || echo "$AUDIT"
          STATUS=$(echo "$AUDIT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','UNKNOWN'))" 2>/dev/null || echo "UNKNOWN")
          echo "audit_status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" = "CRITICAL" ]; then
            echo "::error::Self-audit returned CRITICAL"
          fi
